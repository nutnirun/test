<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมจับคู่ผลไม้</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600&display=swap">
<style>
:root{--bg:#fdeaf3;--card:#fff;--ink:#3a1f33;--mut:#7a5a70;--ac:#d6247f;--ok:#1f8a5b;--line:#f0c4da;--hd:#d6247f;--hdi:#fff;--back:#d6247f;--backi:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1020;--ink:#fbe8f2;--mut:#cfa6bd;--ac:#ff5fa8;--ok:#4cc38a;--line:#5a2a45;--hd:#8f1456;--back:#8f1456}}
:root[data-theme="dark"]{--bg:#2a1020;--ink:#fbe8f2;--mut:#cfa6bd;--ac:#ff5fa8;--ok:#4cc38a;--line:#5a2a45;--hd:#8f1456;--back:#8f1456}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Sarabun,"Noto Sans Thai",sans-serif;font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{background:var(--hd);color:var(--hdi);padding:14px 18px}
h1{font:500 1.5rem/1.3 Mitr,sans-serif;margin:0}
header p{margin:2px 0 0;opacity:.9;font-size:.95rem}
main{max-width:860px;margin:0 auto;padding:16px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:600}
.btn{font:600 1rem Sarabun,sans-serif;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;background:var(--ac);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:520px){.board{grid-template-columns:repeat(3,1fr);gap:8px}}
.card{perspective:700px;aspect-ratio:1/1.05;border:0;background:none;padding:0;cursor:pointer}
.in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.card.up .in,.card.ok .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.front{background:var(--back);color:var(--backi);border:3px solid #fff;font:500 2.2rem Mitr,sans-serif}
.back{transform:rotateY(180deg);background:#fff;border:3px solid var(--line);padding:5px;font:500 1.3rem/1.25 Mitr,sans-serif;color:#3a1f33}
.card.ok .back{border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--ok)}
.back img{width:100%;height:100%;object-fit:contain}
.win{display:none;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.win.show{display:block}
.win .big{font:500 2rem Mitr,sans-serif;color:var(--ac)}
.lv{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.note{color:var(--mut);font-size:.9rem;margin-top:12px}
@media(prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<header><h1>เกมจับคู่ผลไม้</h1><p>จับคู่ภาพผลไม้กับชื่อให้ครบ</p></header>
<main>
  <div class="lv"><span>จำนวนคู่:</span>
    <button class="btn alt sel" data-n="6">6 คู่</button>
    <button class="btn alt" data-n="8">8 คู่</button>
    <button class="btn alt" data-n="10">10 คู่</button>
  </div>
  <div class="bar">
    <span>พลิก <span id="mv">0</span> ครั้ง</span>
    <span>เวลา <span id="tm">0</span> วินาที</span>
    <span>จับคู่ได้ <span id="ok">0</span>/<span id="tot">6</span></span>
    <button class="btn" id="new">เริ่มเกมใหม่</button>
  </div>
  <div class="board" id="board"></div>
  <div class="win" id="win" role="status">
    <div class="big">เก่งมาก จับคู่ครบแล้ว</div>
    <p id="sum"></p>
    <button class="btn" id="again">เล่นอีกครั้ง</button>
  </div>
  <p class="note">พลิกการ์ดทีละ 2 ใบ ถ้าเป็นภาพกับชื่อที่ตรงกัน การ์ดจะค้างไว้ ภาพจากใบงาน BINGO ผลไม้</p>
</main>

const $=id=>document.getElementById(id);
let pairs=6,cards=[],open=[],lock=false,moves=0,matched=0,secs=0,timer=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newGame(){
  clearInterval(timer);timer=null;open=[];lock=false;moves=0;matched=0;secs=0;
  $("mv").textContent=0;$("tm").textContent=0;$("ok").textContent=0;$("tot").textContent=pairs;$("win").classList.remove("show");
  const pick=shuffle(FRUITS.slice()).slice(0,pairs);
  cards=shuffle(pick.flatMap((f,i)=>[{p:i,t:"img",f},{p:i,t:"txt",f}]));
  const b=$("board");b.innerHTML="";
  cards.forEach((c,i)=>{
    const el=document.createElement("button");
    el.className="card";el.setAttribute("aria-label","การ์ดใบที่ "+(i+1));
    el.innerHTML='<div class="in"><div class="face front">?</div><div class="face back">'+(c.t==="img"?'<img alt="" src="'+c.f.i+'">':c.f.n)+'</div></div>';
    el.onclick=()=>flip(i);c.el=el;b.appendChild(el);
  });
}
function flip(i){
  const c=cards[i];
  if(lock||c.el.classList.contains("up")||c.el.classList.contains("ok"))return;
  if(!timer)timer=setInterval(()=>{secs++;$("tm").textContent=secs},1000);
  c.el.classList.add("up");open.push(i);
  if(open.length<2)return;
  moves++;$("mv").textContent=moves;
  const [x,y]=open,A=cards[x],B=cards[y];
  if(A.p===B.p&&A.t!==B.t){
    A.el.classList.replace("up","ok");B.el.classList.replace("up","ok");
    open=[];matched++;$("ok").textContent=matched;
    if(matched===pairs){clearInterval(timer);timer=null;
      $("sum").textContent="ใช้เวลา "+secs+" วินาที พลิก "+moves+" ครั้ง";$("win").classList.add("show")}
  }else{
    lock=true;
    setTimeout(()=>{A.el.classList.remove("up");B.el.classList.remove("up");open=[];lock=false},900);
  }
}
document.querySelectorAll(".lv .btn").forEach(b=>b.onclick=()=>{
  pairs=+b.dataset.n;
  document.querySelectorAll(".lv .btn").forEach(x=>x.classList.toggle("sel",x===b));
  newGame();
});
$("new").onclick=newGame;$("again").onclick=newGame;
newGame();
</script>
